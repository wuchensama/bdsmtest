<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>欲望动物人格测试</title>
<link rel="stylesheet" href="styles.css">
<script>
(function () {
  var ua = navigator.userAgent || "";
  if (!/MicroMessenger/i.test(ua)) return;
  window.__WECHAT_BLOCK__ = true;
  document.documentElement.classList.add("wechat-block");
  document.addEventListener("DOMContentLoaded", function () {
    var app = document.getElementById("app");
    if (!app) return;
    app.className = "screen-wechat";
    app.innerHTML = ""
      + '<section class="wechat-gate" role="dialog" aria-modal="true" aria-label="请在浏览器打开">'
      +   '<p class="archive">OPEN IN BROWSER</p>'
      +   '<div class="wechat-mark" aria-hidden="true">···</div>'
      +   '<h1>请在默认浏览器打开</h1>'
      +   '<p class="wechat-lead">为获得最佳高清海报生成体验，请点击右上角【···】选择【在默认浏览器打开】。</p>'
      +   '<ol class="wechat-steps">'
      +     '<li>点右上角 <b>···</b></li>'
      +     '<li>选择 <b>在默认浏览器打开</b> / <b>在 Safari 打开</b></li>'
      +     '<li>再开始测试并保存海报</li>'
      +   '</ol>'
      +   '<p class="wechat-note">微信内置浏览器可能限制长图保存，也会影响域名安全检测。</p>'
      + '</section>';
  });
})();
</script>
</head>
<body>
<main id="app" class="screen-home">
  <div class="home">
    <p class="archive">ARCHIVE NO.01  ·  INSTINCT TEST</p>
    <h1>欲望动物人格测试</h1>
    <p class="home-sub">- 你的BDSM人格测试 -</p>
    <div class="home-copy">
      <p>白天你是秩序里的普通人，</p>
      <p>关上门，体内却住着另一头野兽。</p>
      <p>是冷静的猎手，还是渴望失重的飞鸟？</p>
      <p class="gap">剥开理性的伪装，</p>
      <p>看看你的灵魂深处，究竟藏着哪一种欲望动物。</p>
    </div>
    <p class="byline">By / Z先生</p>
    <button class="primary home-cta" id="begin" type="button">开始测试</button>
    <p class="home-hint">匿名测评 · 生成专属欲望动物图谱</p>
    <p class="home-note">注：本测试不会收集您的任何个人信息。</p>
  </div>
</main>
<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
